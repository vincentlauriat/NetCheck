name: NetCheck
options:
  bundleIdPrefix: com.vincent
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "26.0"
  developmentLanguage: en

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "KFLACS69T9"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  NetCheckCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/NetCheckCore
    info:
      path: Sources/NetCheckCore/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincent.NetCheckCore
        PRODUCT_NAME: NetCheckCore
        CODE_SIGN_IDENTITY: "-"
        DEFINES_MODULE: NO

  NetCheckUI:
    type: framework
    platform: macOS
    sources:
      - path: Sources/NetCheckUI
    dependencies:
      - target: NetCheckCore
    info:
      path: Sources/NetCheckUI/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincent.NetCheckUI
        PRODUCT_NAME: NetCheckUI
        CODE_SIGN_IDENTITY: "-"
        DEFINES_MODULE: NO

  NetCheck:
    type: application
    platform: macOS
    sources:
      - path: Sources/NetCheck
      - path: Sources/NetCheck/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - target: NetCheckCore
        embed: true
      - target: NetCheckUI
        embed: true
    info:
      path: Sources/NetCheck/Info.plist
      properties:
        CFBundleDisplayName: NetCheck
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "4"
        CFBundleLocalizations: [en, de, fr]
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticGraphicsSwitching: true
        NSLocalNetworkUsageDescription: "NetCheck monitors your internet connectivity."
        NSLocationWhenInUseUsageDescription: "NetCheck utilise votre position pour lister les réseaux Wi-Fi environnants (nom et adresse des points d'accès) — requis par macOS."
        SUFeedURL: "https://raw.githubusercontent.com/vincentlauriat/NetCheck/main/appcast.xml"
        SUPublicEDKey: "9PD2SBwLL4XoycyAGzaE+gO7ctuxSfuFMMajiZdXhXQ="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincent.NetCheck
        PRODUCT_NAME: NetCheck
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: Sources/NetCheck/NetCheck.entitlements

  NetCheckCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/NetCheckCoreTests
    dependencies:
      - target: NetCheckCore
    info:
      path: Tests/NetCheckCoreTests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincent.NetCheckCoreTests
        CODE_SIGN_IDENTITY: "-"

  NetCheckTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/NetCheckTests
    dependencies:
      - target: NetCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincent.NetCheckTests
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NetCheck.app/Contents/MacOS/NetCheck"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  NetCheck:
    build:
      targets:
        NetCheck: all
  NetCheckTests:
    build:
      targets:
        NetCheck: all
        NetCheckCoreTests: [test]
        NetCheckTests: [test]
    test:
      targets:
        - NetCheckCoreTests
        - NetCheckTests
  NetCheckCoreTests:
    build:
      targets:
        NetCheckCoreTests: [test]
    test:
      targets:
        - NetCheckCoreTests
